services:
  web:
    image: node:22-bookworm
    working_dir: /app/car-app
    volumes:
      - .:/app
      - node_modules:/app/car-app/node_modules
    ports:
      - "3000:3000"
    environment:
      CI: "true"
    command: ["sh", "-ec", "corepack enable && yarn install --immutable && exec yarn web"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/app.js', {signal: AbortSignal.timeout(5000)}).then(async r => {if (!r.ok || !(await r.text()).includes('QentWeb')) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 120s
      retries: 3
volumes:
  node_modules:
