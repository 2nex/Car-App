services:
  web:
    image: node:22-bookworm
    working_dir: /app/car-app
    volumes:
      - .:/app
      - node_modules:/app/car-app/node_modules
    ports:
      - "3000:3000"
    environment:
      CI: "true"
      CHOKIDAR_USEPOLLING: "true"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    command: ["sh", "-ec", "corepack enable && yarn install --immutable && exec yarn web"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(5000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
volumes:
  node_modules:
